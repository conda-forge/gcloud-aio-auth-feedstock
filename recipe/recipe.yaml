schema_version: 1

context:
  name: gcloud-aio-auth
  version: "5.6.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/gcloud_aio_auth-${{ version }}.tar.gz
  sha256: b21c5be3a9138c5a9f457a0f4e35fd4ed49f39f39f57fb0311c74d687290518c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }},<4.0
    - aiohttp >=3.9.2,<4.0.0
    - chardet >=2.0,<8.0
    - cryptography >=2.0.0,<52.0.0
    - pyjwt >=1.5.3,<3.0.0
    - tenacity >=8.2.0,<10.0.0
tests:
  - python:
      imports:
        - gcloud.aio.auth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python Client for Google Cloud Auth
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/talkiq/gcloud-aio

extra:
  recipe-maintainers:
    - xylar
